/* ===== ここから下は基本触らなくて大丈夫 ===== */

// X widgets.js ローダ（公式スニペット）
window.twttr = (function (d, s, id) {
  const fjs = d.getElementsByTagName(s)[0];
  const t = window.twttr || {};
  if (d.getElementById(id)) return t;
  const js = d.createElement(s);
  js.id = id;
  js.src = "https://platform.twitter.com/widgets.js";
  js.async = true;
  fjs.parentNode.insertBefore(js, fjs);
  t._e = [];
  t.ready = function (f) { t._e.push(f); };
  return t;
}(document, "script", "twitter-wjs"));

const theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
const el = (tag, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; return n; };

// ---------- ヘッダー ----------
document.getElementById("site-name").textContent = PROFILE.name;
document.getElementById("site-tagline").textContent = PROFILE.tagline;
document.title = "Works — " + PROFILE.name;
const plist = document.getElementById("profile-links");
for (const l of PROFILE.links) {
  const li = el("li"), a = el("a");
  a.href = l.url; a.textContent = l.label;
  a.target = "_blank"; a.rel = "noopener";
  li.append(a); plist.append(li);
}

// ---------- タイル一覧 ----------
const worksEl = document.getElementById("works");
const sections = [];

CATEGORIES.forEach(function (c, i) {
  const items = WORKS.map((w, idx) => ({ w, idx })).filter(o => o.w.cat === c.key);
  if (!items.length) return;

  const sec = el("section", "cat");
  sec.dataset.cat = c.key;

  const num = el("p", "cat-num");
  num.textContent = String(i + 1).padStart(2, "0");
  sec.append(num);

  const name = el("h2", "cat-name");
  name.textContent = c.label;
  sec.append(name);

  let currentGroup = null, grid = null;
  for (const { w, idx } of items) {
    const g = w.group || "";
    if (g !== currentGroup || !grid) {
      currentGroup = g;
      if (g) {
        const gt = el("p", "group-title");
        gt.textContent = g;
        sec.append(gt);
      }
      grid = el("div", "grid");
      sec.append(grid);
    }

    const tile = el("button", "tile");
    tile.type = "button";
    tile.dataset.index = String(idx);

    if (w.thumb) {
      const box = el("span", "tile-thumb");
      const img = el("img");
      img.src = w.thumb;
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";
      box.append(img);
      tile.append(box);
    }

    const y = el("span", "tile-year");
    y.textContent = w.year || "";
    const t = el("span", "tile-title");
    t.textContent = w.title;
    const r = el("span", "tile-role");
    r.textContent = w.role || "";
    tile.append(y, t, r);

    tile.addEventListener("click", () => openWork(idx));
    grid.append(tile);
  }

  worksEl.append(sec);
  sections.push(sec);
});

// ---------- 詳細モーダル ----------
const modal = document.getElementById("modal");
const mYear = document.getElementById("modal-year");
const mTitle = document.getElementById("modal-title");
const mRole = document.getElementById("modal-role");
const mNote = document.getElementById("modal-note");
const mLinks = document.getElementById("modal-links");
const mThumb = document.getElementById("modal-thumb");
const mEmbed = document.getElementById("modal-embed");
const embedCache = new Map();   // 一度読んだ埋め込みは使い回す

document.getElementById("modal-close").addEventListener("click", () => modal.close());

// 背景クリックで閉じる
modal.addEventListener("click", (e) => { if (e.target === modal) modal.close(); });

function openWork(i) {
  const w = WORKS[i];

  mYear.textContent = w.year || "";
  mTitle.textContent = w.title;
  mRole.textContent = w.role || "";
  mRole.hidden = !w.role;
  mNote.textContent = w.note || "";
  mNote.hidden = !w.note;

  // 埋め込みがある場合はそちらに画像が出るので、サムネは重複させない
  const showThumb = Boolean(w.thumb && !w.tweetId);
  mThumb.innerHTML = "";
  mThumb.hidden = !showThumb;
  if (showThumb) {
    const img = el("img");
    img.src = w.thumb; img.alt = ""; img.decoding = "async";
    mThumb.append(img);
  }

  const links = (w.links || []).slice();
  if (w.tweetId) links.push({ label: "X のポストを開く", url: "https://x.com/i/status/" + w.tweetId });
  mLinks.innerHTML = "";
  mLinks.hidden = !links.length;
  for (const l of links) {
    const a = el("a");
    a.href = l.url; a.textContent = l.label + " ↗";
    a.target = "_blank"; a.rel = "noopener";
    mLinks.append(a);
  }

  mEmbed.innerHTML = "";
  mEmbed.hidden = !w.tweetId;
  if (w.tweetId) {
    if (embedCache.has(i)) {
      mEmbed.append(embedCache.get(i));
    } else {
      mEmbed.append(el("div", "embed-skeleton"));
      renderTweet(w.tweetId, mEmbed, i);
    }
  }

  modal.showModal();
  modal.querySelector(".modal-scroll").scrollTop = 0;
}

function renderTweet(id, slot, cacheKey) {
  let done = false;

  const fail = () => {
    if (done) return;
    done = true;
    slot.innerHTML = "";
    const f = el("div", "embed-fallback");
    f.innerHTML = 'ポストを読み込めませんでした。'
      + '<a href="https://x.com/i/status/' + id + '" target="_blank" rel="noopener">X で開く ↗</a>';
    slot.append(f);
  };

  const timer = setTimeout(fail, 8000);   // widgets.js がブロックされた場合の保険

  twttr.ready(function () {
    // align は指定しない（float してレイアウトが崩れるため）
    twttr.widgets.createTweet(id, slot, { theme: theme, lang: "ja", dnt: true })
      .then(function (node) {
        clearTimeout(timer);
        if (!node) { fail(); return; }    // 削除・非公開などで null が返る
        done = true;
        const sk = slot.querySelector(".embed-skeleton");
        if (sk) sk.remove();
        embedCache.set(cacheKey, node);
      })
      .catch(function () { clearTimeout(timer); fail(); });
  });
}

// ---------- カテゴリフィルタ ----------
const filters = document.getElementById("filters");
const makeBtn = (label, value) => {
  const b = el("button");
  b.textContent = label;
  b.setAttribute("aria-pressed", value === "" ? "true" : "false");
  b.addEventListener("click", () => {
    filters.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    sections.forEach(s => { s.hidden = value !== "" && s.dataset.cat !== value; });
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  return b;
};
filters.append(makeBtn("すべて", ""));
CATEGORIES.forEach(c => {
  if (WORKS.some(w => w.cat === c.key)) filters.append(makeBtn(c.label, c.key));
});
</script>
