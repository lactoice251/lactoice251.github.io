/* ===== ここから下は基本触らなくて大丈夫 ===== */

// X widgets.js ローダ（公式スニペット）
window.twttr = (function (d, s, id) {
  const fjs = d.getElementsByTagName(s)[0];
  const t = window.twttr || {};
  if (d.getElementById(id)) return t;
  const js = d.createElement(s);
  js.id = id;
  js.src = "https://platform.twitter.com/widgets.js";
  js.async = true;
  fjs.parentNode.insertBefore(js, fjs);
  t._e = [];
  t.ready = function (f) { t._e.push(f); };
  return t;
}(document, "script", "twitter-wjs"));

const theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
const el = (tag, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; return n; };

// ヘッダー
document.getElementById("site-name").textContent = PROFILE.name;
document.getElementById("site-latin").textContent = PROFILE.latin;
document.getElementById("site-bio").textContent = PROFILE.bio;
document.title = "Works — " + PROFILE.name;
const plist = document.getElementById("profile-links");
for (const l of PROFILE.links) {
  const li = el("li"), a = el("a");
  a.href = l.url; a.textContent = l.label;
  if (!l.url.startsWith("mailto:")) { a.target = "_blank"; a.rel = "noopener"; }
  li.append(a); plist.append(li);
}

// 作品カード
function buildCard(w) {
  const card = el("article", "work");

  if (w.year) {
    const y = el("div", "work-year");
    y.textContent = w.year;
    card.append(y);
  }

  const h = el("h3", "work-title");
  h.textContent = w.title;
  card.append(h);

  if (w.role) {
    const r = el("p", "work-role");
    r.textContent = w.role;
    card.append(r);
  }

  if (w.note) {
    const n = el("p", "work-note");
    n.textContent = w.note;
    card.append(n);
  }

  // 埋め込みが死んでも辿れるよう、素のリンクを必ず出す
  const links = (w.links || []).slice();
  if (w.tweetId) links.push({ label: "X のポストを開く", url: "https://x.com/i/status/" + w.tweetId });
  if (links.length) {
    const box = el("div", "work-links");
    for (const l of links) {
      const a = el("a");
      a.href = l.url;
      a.textContent = l.label + " ↗";
      a.target = "_blank"; a.rel = "noopener";
      box.append(a);
    }
    card.append(box);
  }

  if (w.tweetId) {
    const slot = el("div", "embed");
    slot.append(el("div", "embed-skeleton"));
    slot.dataset.tweetId = w.tweetId;
    card.append(slot);
  }

  return card;
}

// カテゴリ → 小見出し の順に組み立てる
const worksEl = document.getElementById("works");
const sections = [];

CATEGORIES.forEach(function (c, i) {
  const items = WORKS.filter(w => w.cat === c.key);
  if (!items.length) return;

  const sec = el("section", "cat");
  sec.dataset.cat = c.key;

  const kicker = el("p", "cat-title");
  kicker.textContent = String(i + 1).padStart(2, "0");
  sec.append(kicker);

  const name = el("h2", "cat-name");
  name.textContent = c.label;
  sec.append(name);

  let currentGroup = null, holder = sec;
  for (const w of items) {
    const g = w.group || "";
    if (g !== currentGroup) {
      currentGroup = g;
      if (g) {
        const gt = el("p", "group-title");
        gt.textContent = g;
        sec.append(gt);
      }
    }
    holder.append(buildCard(w));
  }

  worksEl.append(sec);
  sections.push(sec);
});

// 埋め込みは画面に入ってから読む
function renderTweet(slot) {
  const id = slot.dataset.tweetId;
  let done = false;

  const fail = () => {
    if (done) return;
    done = true;
    slot.innerHTML = "";
    const f = el("div", "embed-fallback");
    f.innerHTML = 'ポストを読み込めませんでした。'
      + '<a href="https://x.com/i/status/' + id + '" target="_blank" rel="noopener">X で開く ↗</a>';
    slot.append(f);
  };

  const timer = setTimeout(fail, 8000);   // widgets.js がブロックされた場合の保険

  twttr.ready(function () {
    twttr.widgets.createTweet(id, slot, { theme: theme, align: "left", lang: "ja", dnt: true })
      .then(function (node) {
        clearTimeout(timer);
        if (!node) { fail(); return; }    // 削除・非公開などで null が返る
        done = true;
        const sk = slot.querySelector(".embed-skeleton");
        if (sk) sk.remove();
      })
      .catch(function () { clearTimeout(timer); fail(); });
  });
}

const io = new IntersectionObserver(function (entries) {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    io.unobserve(e.target);
    renderTweet(e.target);
  }
}, { rootMargin: "300px" });

document.querySelectorAll(".embed").forEach(s => io.observe(s));

// カテゴリフィルタ
const filters = document.getElementById("filters");
const makeBtn = (label, value) => {
  const b = el("button");
  b.textContent = label;
  b.setAttribute("aria-pressed", value === "" ? "true" : "false");
  b.addEventListener("click", () => {
    filters.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    sections.forEach(s => { s.hidden = value !== "" && s.dataset.cat !== value; });
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  return b;
};
filters.append(makeBtn("すべて", ""));
CATEGORIES.forEach(c => {
  if (WORKS.some(w => w.cat === c.key)) filters.append(makeBtn(c.label, c.key));
});
